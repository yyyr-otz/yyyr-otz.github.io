name: 部署到云平台

on:
  workflow_dispatch:
  push:
    branches: [ gh-pages ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: npm i
      - name: 🚀 部署到 cloudflare workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest deploy
      - name: 🚀 部署到 google firebase hosting
        env:
          FIREBASE_AUTHORIZATION_CODE: ${{ secrets.FIREBASE_AUTHORIZATION_CODE }}
        run: |
          npx firebase-tools@14.3.1 deploy --token ${{ secrets.FIREBASE_AUTHORIZATION_CODE }} --project ${{ secrets.FIREBASE_PROJECT_ID }}
      - name: 清理工作流
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.MYPAT }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
